# Nginx Configuration for khabarline.site & Admin Dashboard
# Save to: /etc/nginx/sites-available/khabarline.site
# Symlink to: /etc/nginx/sites-enabled/khabarline.site

# 1. Khabarline.site (Public DPBoss Replica Website & API on Port 8080)
server {
    listen 80;
    listen [::]:80;
    server_name khabarline.site www.khabarline.site;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy to Node.js Khabarline Server (Port 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Real-time SSE Live Stream support
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static spinner & image assets caching
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

